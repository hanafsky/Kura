[package]
name = "kura"
version = "0.5.0"
edition = "2021"

[dependencies]
crossterm = "0.29"
ratatui = "0.30"
ratatui-image = { version = "11.1", default-features = false, features = ["crossterm", "image-defaults"] }
image = "0.25"
unicode-width = "0.1"
trash = "5.4"
clap = { version = "4.6.9", features = ["derive"] }
notify-debouncer-mini = "0.8.0"
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "default-syntaxes", "default-themes", "regex-fancy"] }
pulldown-cmark = { version = "0.13.6", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
